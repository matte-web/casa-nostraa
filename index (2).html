<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Nostra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F6;--surface:#fff;--ink:#16222F;--muted:#5C6B7A;--line:#D5DDE6;--accent:#3946D0;--accent-ink:#fff;--note:#F6D365;--note-ink:#2B2300;--pos:#1B7F5A;--neg:#C2412D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--surface:#18232F;--ink:#E8EEF4;--muted:#93A3B3;--line:#2A3846;--accent:#8C98FF;--accent-ink:#0F1720;--note:#E6BF4B;--note-ink:#2B2300;--pos:#4FD1A0;--neg:#FF8A73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1720;--surface:#18232F;--ink:#E8EEF4;--muted:#93A3B3;--line:#2A3846;--accent:#8C98FF;--accent-ink:#0F1720;--note:#E6BF4B;--note-ink:#2B2300;--pos:#4FD1A0;--neg:#FF8A73;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:600;margin:28px 0 10px}
.sub{color:var(--muted);margin:4px 0 18px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .95rem Figtree,system-ui,sans-serif;padding:10px;border-radius:9px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.who{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:1.6rem;letter-spacing:-.01em;color:var(--accent)}
.chore-name{font-weight:600}
.meta{color:var(--muted);font-size:.875rem}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--muted);padding:6px;text-decoration:underline;cursor:pointer}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.add>*{flex:1 1 140px}.add .btn{flex:0 0 auto}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.note{background:var(--note);color:var(--note-ink);border-radius:4px 4px 14px 4px;padding:14px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.note .x{color:var(--note-ink);align-self:flex-end;padding:0}
.note p{margin:0;font-weight:500;overflow-wrap:anywhere}
.note small{opacity:.75}
.empty{color:var(--muted);padding:18px 4px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:grid;gap:8px}
.btn.arrow{padding:6px 16px;font-size:1.4rem;line-height:1.2}
.days{display:flex;gap:6px;justify-content:space-between;margin-top:14px}
.sq{flex:1;aspect-ratio:1;max-width:44px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;font:600 .9rem Figtree,system-ui,sans-serif;cursor:pointer;padding:0}
.sq.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sq.today{border-color:var(--ink)}
.duty{display:flex;align-items:center;gap:12px;margin-top:10px}
.duty .sq{flex:0 0 36px;width:36px;height:36px}
.top{align-items:flex-start}
.msgs{display:grid;gap:8px;margin-bottom:12px}
.msg{justify-self:start;max-width:85%;color:#16222F;border:0;border-radius:14px 14px 14px 4px;padding:8px 12px}
.msg.me{justify-self:end;border-radius:14px 14px 4px 14px}
.msg p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.msg small{opacity:.75}
.menu{padding:4px 14px;font-size:1.4rem;line-height:1.3}
.scrim{position:fixed;inset:0;background:rgba(20,10,30,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--surface);color:var(--ink);z-index:21;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .btn{width:100%;text-align:left}
.drawer h3{font-size:1.3rem}
.house[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.chip{font-weight:600}
.chip.big{display:inline-block;font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-.01em;color:var(--accent);margin:2px 0 4px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY="casa-nostra-v1";
var ALL={houses:[],cur:null};
var S={id:"",house:"",members:[],chores:[],expenses:[],notes:[]};
var drawer={open:false,view:"menu"},creating=false;
function blank(){return {id:uid(),house:"",members:[],chores:[],expenses:[],notes:[]};}
function newHouse(){var h=blank();ALL.houses.push(h);ALL.cur=h.id;return h;}
function deleteHouse(){ALL.houses=ALL.houses.filter(function(h){return h!==S;});S=ALL.houses[0]||blank();ALL.cur=ALL.houses[0]?ALL.houses[0].id:null;}
var BIG=["Bobo","Tom Gomma","Ebrima"];
function nm(a,b){a=a.trim().toLowerCase();b=b.trim().toLowerCase();return a===b||a.indexOf(b)===0||b.indexOf(a)===0;}
function inBig(m){return BIG.some(function(x){return nm(m,x);});}
function poolOf(z){var p=S.members;if(z.id==="z1")p=S.members.filter(inBig);else if(z.id==="z2")p=S.members.filter(function(m){return !inBig(m);});return p.length?p:S.members;}
var editZone="";
function isAdmin(){return !!S.admin&&S.admin===S.me&&S.members.indexOf(S.admin)>-1;}
function planned(z){var p=(S.plan||{})[z.id];return !!p&&Object.keys(p).some(function(k){return p[k];});}
function adminHtml(z){
  if(!isAdmin())return planned(z)?'<div class="meta" style="margin-top:10px">Giorni stabiliti da '+esc(S.admin)+', validi fino a nuovo ordine.</div>':'';
  var h='<div class="add"><button class="btn ghost" data-act="editplan" data-id="'+z.id+'">'+(editZone===z.id?'Chiudi modifica':'Modifica giorni')+'</button></div>';
  if(editZone!==z.id)return h;
  var full=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"],pl=(S.plan||{})[z.id]||{};
  h+='<div style="margin-top:8px">';
  for(var i=0;i<7;i++){h+='<div class="row" style="margin:6px 0"><label for="p'+z.id+i+'" style="margin:0">'+full[i]+'</label><select id="p'+z.id+i+'" data-plan="'+z.id+':'+i+'" style="width:60%"><option value="">Nessuno</option>'+S.members.map(function(m){return '<option'+(pl[i]===m?' selected':'')+'>'+esc(m)+'</option>';}).join("")+'</select></div>';}
  return h+'<button class="btn ghost" data-act="clearplan" data-id="'+z.id+'">Torna alla rotazione automatica</button></div>';
}
function adminViewHtml(){
  var has=S.admin&&S.members.indexOf(S.admin)>-1,me=S.members.indexOf(S.me)>-1,p='';
  if(!has){
    p+='<p class="meta" style="margin:0">Questa casa non ha ancora un amministratore. Chi lo è decide i giorni di pulizia degli altri.</p>';
    return p+(me?'<button class="btn" data-act="claimadmin">Diventa amministratore</button>':'<p class="meta" style="margin:0">Per candidarti scegli prima chi sei dal profilo utente.</p><button class="btn ghost" data-act="dview" data-id="profile">Mostra profilo utente</button>');
  }
  p+='<div class="meta">Amministratore</div>'+chip(S.admin,true);
  if(!isAdmin())return p+'<p class="meta" style="margin:0">Solo l’amministratore può cambiare i giorni di pulizia.</p>';
  p+='<p class="meta" style="margin:0">Sei tu l’amministratore: modifica i giorni dalla scheda Turni.</p><div class="meta">Passa il ruolo a</div>';
  S.members.forEach(function(m){if(m!==S.admin)p+='<button class="btn ghost" data-act="setadmin" data-id="'+esc(m)+'">'+chip(m)+'</button>';});
  return p+'<button class="btn ghost" data-act="leaveadmin">Lascia il ruolo</button>';
}
var chatWho="",chatFocus=false;
function chatView(){
  var h='<h2>Chat di casa</h2>',list=(S.chat||[]).slice(-100);
  if(!list.length)h+='<div class="empty">Nessun messaggio. Scrivi il primo qui sotto.</div>';
  else{
    h+='<div class="msgs">';
    list.forEach(function(m){h+='<div class="msg'+(m.who===S.me?' me':'')+'" style="background:'+pc(m.who)+'"><small><strong>'+esc(m.who)+'</strong> · '+new Date(m.at).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</small><p>'+esc(m.text)+'</p></div>';});
    h+='</div>';
  }
  if(S.members.indexOf(S.me)<0)return h+'<div class="card"><p style="margin:0 0 8px">Per scrivere in chat scegli prima chi sei in questa casa.</p><div class="add"><button class="btn" data-act="openprofile">Scegli il tuo profilo</button></div></div>';
  h+='<div class="card"><div class="meta">Scrivi come</div><span class="chip" style="background:'+pc(S.me)+';padding:2px 12px;border-radius:999px;color:#16222F;display:inline-block;margin-top:4px">'+esc(S.me)+'</span><label for="ct">Messaggio</label><textarea id="ct" rows="2" placeholder="Scrivi un messaggio"></textarea><div class="add"><button class="btn" data-act="sendchat">Invia</button></div></div>';
  return h;
}
var zoneOff={};
function daysHtml(z,k,wk,dn,off,dow){
  var ini=["L","M","M","G","V","S","D"],full=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"],h="",i;
  function sq(i,label){var on=dn[i];return '<button class="sq'+(on?' on':'')+(off===0&&i===dow?' today':'')+'" data-act="zoneday" data-id="'+z.id+'" data-k="'+k+'" data-i="'+i+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+full[i]+'">'+label+'</button>';}
  var pl=(S.plan||{})[z.id];
  if(planned(z)){for(i=0;i<7;i++){if(pl[i])h+='<div class="duty">'+sq(i,dn[i]?'✓':'')+'<span><strong>'+full[i]+':</strong> '+esc(pl[i])+'</span></div>';}return h;}
  if(z.id!=="z3"){h='<div class="days">';for(i=0;i<7;i++)h+=sq(i,ini[i]);return h+'</div>';}
  var n=S.members.length,w=((wk%2)+2)%2,names=w===0?["Edoardo","Pa","Ebrima"]:["Matteo","Tomm",null];
  [1,3,5].forEach(function(d,j){
    var who=names[j]||("a giro tutti: "+S.members[((((wk-1)/2)%n)+n)%n]);
    h+='<div class="duty">'+sq(d,dn[d]?'✓':'')+'<span><strong>'+full[d]+':</strong> '+esc(who)+'</span></div>';
  });
  return h;
}
function wkKey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function zonesHtml(){
  if(!S.zones)S.zones=[{id:"z1",name:"Bagno grande",idx:0,done:{}},{id:"z2",name:"Bagno piccolo",idx:1,done:{}},{id:"z3",name:"Cucina",idx:2,done:{}}];
  S.zones.forEach(function(z){if(z.id==="z1")z.name="Bagno grande";if(z.id==="z2")z.name="Bagno piccolo";});
  var n=S.members.length,t=new Date();t.setHours(0,0,0,0);
  var dow=(t.getDay()+6)%7,h='<h2>Pulizie per zona</h2>';
  S.zones.forEach(function(z){
    var off=zoneOff[z.id]||0,mon=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dow+off*7),sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
    var wk=Math.round((mon-new Date(2024,0,1))/604800000),pl=poolOf(z),m=pl.length,who=pl[(((wk+z.idx)%m)+m)%m],k=wkKey(mon),dn=(z.days&&z.days[k])||{};
    h+='<div class="card"><div class="row"><strong>'+esc(z.name)+'</strong><span class="meta">'+(off===0?'Questa settimana':off===1?'Settimana prossima':off===-1?'Settimana scorsa':'')+'</span></div>'+
    '<div class="row" style="margin-top:6px"><button class="btn arrow" data-act="zoneoff" data-id="'+z.id+'" data-d="-1" aria-label="Settimana precedente">‹</button>'+
    '<div style="text-align:center">'+(planned(z)?'<strong>Piano fisso</strong>':z.id==="z3"?'<strong>Settimana '+(wk%2===0?1:2)+'</strong>':chip(who,true))+'<div class="meta">'+day(mon)+' – '+day(sun)+'</div></div>'+
    '<button class="btn arrow" data-act="zoneoff" data-id="'+z.id+'" data-d="1" aria-label="Settimana successiva">›</button></div>'+
    daysHtml(z,k,wk,dn,off,dow)+adminHtml(z)+'</div>';
  });
  return h;
}
function drawerHtml(){
  if(!drawer.open)return "";
  var v=drawer.view,t=v==="houses"?"Le tue case":v==="profile"?"Profilo utente":v==="members"?"Partecipanti":v==="admin"?"Amministratore":"Menu";
  var b='<div class="scrim" data-act="closedrawer"></div><aside class="drawer" role="dialog" aria-label="'+t+'"><div class="row"><h3>'+t+'</h3><button class="x" data-act="closedrawer" aria-label="Chiudi il menu">×</button></div><div class="stack" style="margin-top:14px">';
  if(v==="menu"){b+='<button class="btn" data-act="dview" data-id="houses">Cambia casa</button><button class="btn" data-act="dview" data-id="profile">Mostra profilo utente</button><button class="btn" data-act="dview" data-id="members">Gestisci partecipanti</button><button class="btn" data-act="dview" data-id="admin">Amministratore</button><button class="btn" data-act="newhouse">Crea nuova casa</button>'+(S.code?'':'<button class="btn" data-act="sharehouse">Condividi con i coinquilini</button>');}
  else{
    b+='<button class="btn link" style="text-align:left" data-act="dview" data-id="menu">Torna al menu</button>';
    if(v==="houses"){ALL.houses.forEach(function(h){b+='<button class="btn ghost house" data-act="pick" data-id="'+h.id+'"'+(h===S?' aria-current="true"':'')+'><strong>'+esc(h.house||"Casa senza nome")+'</strong><br><span class="meta">'+h.members.length+' persone'+(h===S?', casa attuale':'')+'</span></button>';});}
    else if(v==="members")b+=membersHtml();
    else if(v==="admin")b+=adminViewHtml();
    else b+=profileHtml();
  }
  return b+'</div></aside>';
}
var confirmRm="";
function membersHtml(){
  var p='<div class="meta">'+S.members.length+' partecipanti in '+esc(S.house||"questa casa")+'. Ne servono almeno due.</div>';
  S.members.forEach(function(m){
    p+='<div class="row" style="padding:2px 0"><span>'+chip(m)+'</span>'+(confirmRm===m?'<button class="btn" style="width:auto" data-act="rmmember" data-id="'+esc(m)+'">Conferma</button>':'<button class="x" data-act="rmmember" data-id="'+esc(m)+'" aria-label="Rimuovi '+esc(m)+'"'+(S.members.length<=2?' disabled':'')+'>×</button>')+'</div>';
  });
  p+='<label for="nm">Aggiungi partecipante</label><input id="nm" placeholder="Nome"><button class="btn" data-act="addmember">Aggiungi</button>';
  return p;
}
function profileHtml(){
  var me=S.members.indexOf(S.me)>-1?S.me:"",p="";
  if(!me){p='<p class="meta" style="margin:0">Chi sei in questa casa?</p>';S.members.forEach(function(m){p+='<button class="btn ghost" data-act="setme" data-id="'+esc(m)+'">'+chip(m)+'</button>';});return p;}
  var paid=0;S.expenses.forEach(function(e){if(e.payer===me)paid+=e.amount;});
  var bal=balances()[me]/100;
  var turns=S.chores.filter(function(c){return S.members[c.idx%S.members.length]===me;}).map(function(c){return esc(c.name);});
  var nn=S.notes.filter(function(n){return n.who===me;}).length;
  p=chip(me,true)+'<p class="meta" style="margin:0">'+esc(S.house||"Casa senza nome")+'</p>';
  p+='<div class="stat"><span>Speso finora</span><strong>'+eur(paid)+'</strong></div>';
  p+='<div class="stat"><span>Saldo</span><span class="'+(bal>0.004?'pos':bal<-0.004?'neg':'meta')+'">'+(bal>0.004?'riceve '+eur(bal):bal<-0.004?'deve '+eur(-bal):'in pari')+'</span></div>';
  p+='<div class="stat"><span>Tocca a te</span><strong>'+(turns.length?turns.join(", "):'nessun turno')+'</strong></div>';
  p+='<div class="stat"><span>Avvisi pubblicati</span><strong>'+nn+'</strong></div>';
  p+='<button class="btn ghost" data-act="clearme">Non sono io</button>';
  return p;
}
var tab="turni",confirmSettle=false,confirmReset=false;
try{
  var r2=localStorage.getItem("casa-nostra-v2");
  if(r2){ALL=Object.assign(ALL,JSON.parse(r2));}
  else{var r1=localStorage.getItem(KEY);if(r1){var o=JSON.parse(r1);if(o&&o.members&&o.members.length){o.id=uid();ALL.houses.push(o);ALL.cur=o.id;}}}
}catch(e){}
S=ALL.houses.filter(function(h){return h.id===ALL.cur;})[0]||ALL.houses[0]||S;
if(ALL.houses.length)ALL.cur=S.id;

/* ---------- Sincronizzazione con Supabase ---------- */
var SB_URL="https://ewjlezckccmnlnbihtkq.supabase.co",SB_KEY="sb_publishable_AA0ISjLvf9SkhvQm61deFg_xjadp5UX";
var SHARED=["house","members","chores","expenses","notes","chat","zones","plan","admin"];
var dirty=false,pushing=false,cc=false,syncState="ok",joinErr="";
function setSync(x){syncState=x;}
function shared(h){var o={};SHARED.forEach(function(k){if(h[k]!==undefined)o[k]=h[k];});return o;}
function apply(h,r,ver){SHARED.forEach(function(k){if(r[k]!==undefined)h[k]=r[k];else delete h[k];});h.ver=ver;}
function rpc(fn,args){return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function genCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=new Uint8Array(8),c="";crypto.getRandomValues(b);for(var i=0;i<8;i++)c+=a[b[i]%a.length];return c;}
function merge(h,r){["chat","expenses","notes","payments"].forEach(function(k){var l=h[k]||[],ids={};l.forEach(function(x){ids[x.id]=1;});(r[k]||[]).forEach(function(x){if(!ids[x.id])l.push(x);});l.sort(function(a,b){return a.at-b.at;});h[k]=l;});}
function softRender(){var fe=document.activeElement,fid=fe&&fe.id;render();if(fid){var e2=document.getElementById(fid);if(e2)e2.focus();}}
function cloudCreate(h){cc=true;rpc("create_house",{p_code:h.code,p_data:shared(h)}).then(function(v){h.ver=v;persist();setSync("ok");}).catch(function(){setSync("err");}).then(function(){cc=false;});}
function doPush(){
  var h=S,merged=false;
  if(!h.code||!h.ver||!dirty||pushing)return;
  pushing=true;dirty=false;
  rpc("save_house",{p_code:h.code,p_data:shared(h),p_version:h.ver}).then(function(v){
    if(v!==null){h.ver=v;persist();setSync("ok");return;}
    return rpc("get_house",{p_code:h.code}).then(function(rows){var r=rows[0];if(r){merge(h,r.data);h.ver=r.version;dirty=true;merged=true;persist();}});
  }).catch(function(){setSync("err");dirty=true;}).then(function(){pushing=false;if(merged&&S===h)softRender();});
}
function polling(){
  if(document.hidden||!S.code)return;
  if(!S.ver){if(!cc)cloudCreate(S);return;}
  if(dirty){doPush();return;}
  if(pushing)return;
  if(Array.prototype.some.call(document.querySelectorAll("#app input,#app textarea"),function(i){return i.value;}))return;
  var h=S;
  rpc("get_house",{p_code:h.code}).then(function(rows){
    if(S!==h||dirty||pushing)return;
    var r=rows[0];setSync("ok");
    if(r&&r.version>h.ver){apply(h,r.data,r.version);persist();softRender();}
  }).catch(function(){setSync("err");});
}
setInterval(polling,4000);
function codeLine(){return S.code?'<p class="meta" style="margin:-10px 0 14px">Codice d\u2019invito: <strong>'+esc(S.code)+'</strong> \u00b7 '+(syncState==="err"?'offline, riprovo\u2026':'sincronizzata')+'</p>':'<p class="meta" style="margin:-10px 0 14px">Casa solo su questo dispositivo</p>';}
function joinCard(){return '<h2>Hai un codice d\u2019invito?</h2><div class="card"><label for="jc">Codice della casa</label><input id="jc" autocapitalize="characters" placeholder="Es. K7M2QX9A"><div class="add"><button class="btn" data-act="join">Entra nella casa</button></div>'+(joinErr?'<p class="meta">'+esc(joinErr)+'</p>':'')+'</div>';}

function persist(){try{localStorage.setItem("casa-nostra-v2",JSON.stringify(ALL));}catch(e){}}
function save(){persist();if(S.code)dirty=true;}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function eur(n){return n.toLocaleString("it-IT",{style:"currency",currency:"EUR"});}
function day(d){return new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short"});}
function val(id){var el=document.getElementById(id);return el?el.value.trim():"";}
var PAL=["#F2A488","#8FD18B","#F0C14B","#6FD3D3","#F29BBF","#C3A6F0"];
function pc(n){var i=S.members.indexOf(n);return PAL[(i<0?0:i)%PAL.length];}
function chip(n,big){return '<span class="chip'+(big?' big':'')+'">'+esc(n)+'</span>';}
function opts(sel){return S.members.map(function(m){return '<option'+(m===sel?' selected':'')+'>'+esc(m)+'</option>';}).join("");}

function balances(){
  var n=S.members.length,b={};
  S.members.forEach(function(m){b[m]=0;});
  S.expenses.forEach(function(e){
    var ps=e.parts||S.members,c=Math.round(e.amount*100),share=c/ps.length;
    if(!(e.payer in b))b[e.payer]=0;
    b[e.payer]+=c;
    ps.forEach(function(m){if(!(m in b))b[m]=0;b[m]-=share;});
  });
  (S.payments||[]).forEach(function(p){b[p.from]+=p.amount;b[p.to]-=p.amount;});
  return b;
}
function transfers(b){
  var cr=[],de=[],out=[],i=0,j=0;
  for(var m in b){var v=Math.round(b[m]);if(v>0)cr.push([m,v]);else if(v<0)de.push([m,-v]);}
  cr.sort(function(a,b){return b[1]-a[1];});de.sort(function(a,b){return b[1]-a[1];});
  while(i<cr.length&&j<de.length){
    var x=Math.min(cr[i][1],de[j][1]);
    out.push([de[j][0],cr[i][0],x]);
    cr[i][1]-=x;de[j][1]-=x;
    if(!cr[i][1])i++;if(!de[j][1])j++;
  }
  return out;
}

function setupView(){
  return '<h1>Casa nostra</h1><p class="sub">Turni, spese e avvisi per chi vive insieme. Inizia creando la tua casa.</p>'+
  '<div class="card"><label for="h">Nome della casa</label><input id="h" placeholder="Es. Via Tadino 12">'+
  '<label for="m">Chi abita qui? Scrivi i nomi separati da virgola</label><input id="m" placeholder="Giulia, Marco, Sara">'+
  '<div class="add"><button class="btn" data-act="create">Crea la casa</button><button class="btn ghost" data-act="demo">Prova con dati d’esempio</button>'+(ALL.houses.length?'<button class="btn ghost" data-act="cancelnew">Annulla</button>':'')+'</div></div>'+joinCard();
}

function turniView(){
  var h=zonesHtml()+'<h2>Altri compiti</h2>';
  if(!S.chores.length)h+='<div class="empty">Nessun compito ancora. Aggiungi il primo qui sotto.</div>';
  S.chores.forEach(function(c){
    var who=S.members[c.idx%S.members.length];
    h+='<div class="card"><div class="row"><div><div class="chore-name">'+esc(c.name)+'</div>'+chip(who,true)+'<br>'+
    '<div class="meta">'+(c.last?'Ultima volta: '+chip(c.last.who)+', '+day(c.last.at):'Mai fatto finora')+'</div></div>'+
    '<div class="stack"><button class="btn" data-act="done" data-id="'+c.id+'">Fatto</button><button class="btn link" data-act="delchore" data-id="'+c.id+'">Elimina</button></div></div></div>';
  });
  h+='<div class="add"><input id="cn" placeholder="Nuovo compito, es. Lavare i vetri"><button class="btn" data-act="addchore">Aggiungi compito</button></div>';
  return h;
}

function speseView(){
  var b=balances(),t=transfers(b),h='<h2>Saldi</h2><div class="card">';
  Object.keys(b).forEach(function(m){
    var v=b[m]/100,cls=v>0.004?'pos':v<-0.004?'neg':'meta',txt=v>0.004?'deve ricevere '+eur(v):v<-0.004?'deve dare '+eur(-v):'in pari';
    h+='<div class="row" style="padding:4px 0"><span>'+chip(m)+(S.members.indexOf(m)<0?' <span class="meta">(ex partecipante)</span>':'')+'</span><span class="'+cls+'">'+txt+'</span></div>';
  });
  h+='</div>';
  if(t.length){
    h+='<h2>Per pareggiare i conti</h2>';
    t.forEach(function(x){h+='<div class="card duty" style="margin-top:0"><button class="sq" data-act="pay" data-f="'+esc(x[0])+'" data-t="'+esc(x[1])+'" data-a="'+x[2]+'" aria-label="Segna come pagato"></button><span>'+chip(x[0])+' paga <strong>'+eur(x[2]/100)+'</strong> a '+chip(x[1])+'</span></div>';});
    h+='<button class="btn ghost" data-act="settle">'+(confirmSettle?'Conferma: cancella tutte le spese':'Segna come saldato')+'</button>';
  }
  var pays=S.payments||[];
  if(!t.length&&(S.expenses.length||pays.length))h+='<div class="card"><strong class="pos">Tutto saldato</strong><div class="meta">Tutti hanno pagato la propria parte: nessuno deve più niente.</div></div><button class="btn ghost" data-act="settle">'+(confirmSettle?'Conferma: cancella tutte le spese':'Azzera e ricomincia')+'</button>';
  if(pays.length){h+='<h2>Pagamenti effettuati</h2>';pays.forEach(function(p){h+='<div class="card duty" style="margin-top:0"><button class="sq on" data-act="unpay" data-id="'+p.id+'" aria-label="Annulla il pagamento">✓</button><span>'+chip(p.from)+' ha pagato <strong>'+eur(p.amount/100)+'</strong> a '+chip(p.to)+'</span><span class="meta" style="margin-left:auto">'+day(p.at)+'</span></div>';});}
  h+='<h2>Nuova spesa</h2><div class="card"><label for="ed">Cosa hai pagato?</label><input id="ed" placeholder="Es. Bolletta della luce">'+
  '<label for="ea">Importo in euro</label><input id="ea" inputmode="decimal" placeholder="45,00">'+
  '<label for="ep">Chi ha pagato?</label><select id="ep">'+opts()+'</select>'+
  '<div class="add"><button class="btn" data-act="addexp">Aggiungi spesa</button></div><p class="meta">La spesa viene divisa in parti uguali tra tutti.</p></div>';
  h+='<h2>Storico</h2>';
  if(!S.expenses.length)h+='<div class="empty">Nessuna spesa registrata.</div>';
  S.expenses.slice().reverse().forEach(function(e){
    h+='<div class="card row"><div><div class="chore-name">'+esc(e.desc)+'</div><div class="meta">'+chip(e.payer)+' · '+day(e.at)+'</div></div><div class="row"><strong>'+eur(e.amount)+'</strong><button class="x" aria-label="Elimina spesa" data-act="delexp" data-id="'+e.id+'">×</button></div></div>';
  });
  return h;
}

function bachecaView(){
  var h='<h2>Bacheca</h2>';
  if(!S.notes.length)h+='<div class="empty">Nessun avviso. Scrivi il primo: ospiti, bollette, rubinetto che perde.</div>';
  else{
    h+='<div class="notes">';
    S.notes.slice().reverse().forEach(function(n){
      h+='<div class="note"><button class="x" aria-label="Elimina avviso" data-act="delnote" data-id="'+n.id+'">×</button><p>'+esc(n.text)+'</p><small>'+esc(n.who)+', '+day(n.at)+'</small></div>';
    });
    h+='</div>';
  }
  h+='<h2>Nuovo avviso</h2><div class="card"><label for="nt">Messaggio</label><textarea id="nt" rows="3" placeholder="Sabato sera ho gente a cena"></textarea>'+
  '<label for="nw">Da parte di</label><select id="nw">'+opts()+'</select><div class="add"><button class="btn" data-act="addnote">Pubblica avviso</button></div></div>';
  return h;
}

function render(){
  var app=document.getElementById("app");app.dataset.tab=S.members.length?tab:"";
  if(!S.members.length||creating){app.innerHTML=setupView();return;}
  var tabs=[["turni","Turni"],["spese","Spese"],["bacheca","Bacheca"],["chat","Chat"]];
  var h='<div class="row top"><h1>'+esc(S.house||"Casa nostra")+'</h1><button class="btn menu" data-act="menu" aria-label="Apri il menu">☰</button></div><p class="sub">'+S.members.map(esc).join(", ")+'</p>'+codeLine()+'<nav aria-label="Sezioni">';
  tabs.forEach(function(t){h+='<button data-act="tab" data-id="'+t[0]+'"'+(tab===t[0]?' aria-current="true"':'')+'>'+t[1]+'</button>';});
  h+='</nav>'+(tab==="turni"?turniView():tab==="spese"?speseView():tab==="chat"?chatView():bachecaView());
  if(tab!=="turni")h+='<p style="margin-top:36px"><button class="btn link" data-act="reset">'+(confirmReset?'Conferma: elimina la casa':'Elimina questa casa')+'</button></p>';
  h+=drawerHtml();app.innerHTML=h;
}

function demo(){
  var now=Date.now(),d=86400000;
  S=newHouse();Object.assign(S,{house:"Via Tadino 12",members:["Giulia","Marco","Sara","Luca"],
  chores:[{id:uid(),name:"Spazzatura e differenziata",idx:0,last:null},{id:uid(),name:"Pavimenti",idx:3,last:{who:"Sara",at:now-6*d}}],
  expenses:[{id:uid(),desc:"Bolletta luce",amount:84,payer:"Giulia",at:now-5*d},{id:uid(),desc:"Spesa al supermercato",amount:52.4,payer:"Marco",at:now-2*d},{id:uid(),desc:"Detersivi",amount:18.6,payer:"Luca",at:now-d}],
  notes:[{id:uid(),text:"Sabato sera ho tre amici a cena, scusate in anticipo!",who:"Sara",at:now-d},{id:uid(),text:"Il rubinetto del bagno gocciola, chiamo l’idraulico lunedì.",who:"Luca",at:now}],chat:[{id:uid(),who:"Marco",text:"Chi passa a ritirare il pacco domani?",at:now-3600000},{id:uid(),who:"Giulia",text:"Io sono a casa tutto il giorno, ci penso io!",at:now-1800000}]});
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,id=el.dataset.id,keepConfirm=false;
  if(a==="tab"){tab=id;}
  else if(a==="create"){
    var ms=val("m").split(",").map(function(x){return x.trim();}).filter(Boolean);
    ms=ms.filter(function(x,i){return ms.indexOf(x)===i;});
    if(ms.length<2){alert("Inserisci almeno due nomi, separati da virgola.");return;}
    S=newHouse();S.house=val("h");S.members=ms;creating=false;S.code=genCode();cloudCreate(S);
  }
  else if(a==="demo"){demo();creating=false;}
  else if(a==="menu"){drawer.open=true;drawer.view="menu";}
  else if(a==="closedrawer"){drawer.open=false;}
  else if(a==="dview"){drawer.view=id;}
  else if(a==="pick"){var hh=ALL.houses.filter(function(x){return x.id===id;})[0];if(hh){S=hh;ALL.cur=hh.id;tab="turni";}drawer.open=false;}
  else if(a==="newhouse"){drawer.open=false;creating=true;}
  else if(a==="cancelnew"){creating=false;}
  else if(a==="setme"){S.me=id;}
  else if(a==="clearme"){S.me="";}
  else if(a==="pay"){S.payments=S.payments||[];S.payments.push({id:uid(),from:el.dataset.f,to:el.dataset.t,amount:parseInt(el.dataset.a,10),at:Date.now()});}
  else if(a==="unpay"){S.payments=(S.payments||[]).filter(function(p){return p.id!==id;});}
  else if(a==="sharehouse"){if(!S.code){S.code=genCode();cloudCreate(S);}drawer.open=false;}
  else if(a==="join"){
    var jc=val("jc").toUpperCase().replace(/[^A-Z0-9]/g,"");if(!jc)return;
    var ex=ALL.houses.filter(function(x){return x.code===jc;})[0];
    if(ex){S=ex;ALL.cur=ex.id;creating=false;}
    else{
      joinErr="Cerco la casa\u2026";render();
      rpc("get_house",{p_code:jc}).then(function(rows){
        if(!rows[0]){joinErr="Codice non trovato.";}
        else{var nh=blank();nh.code=jc;apply(nh,rows[0].data,rows[0].version);ALL.houses.push(nh);ALL.cur=nh.id;S=nh;creating=false;joinErr="";tab="turni";drawer.open=true;drawer.view="profile";persist();}
        render();
      }).catch(function(){joinErr="Connessione non riuscita. Riprova.";render();});
      return;
    }
  }
  else if(a==="editplan"){editZone=editZone===id?"":id;}
  else if(a==="clearplan"){if(isAdmin()&&S.plan)delete S.plan[id];}
  else if(a==="claimadmin"){if(!S.admin&&S.members.indexOf(S.me)>-1)S.admin=S.me;}
  else if(a==="setadmin"){if(isAdmin())S.admin=id;}
  else if(a==="leaveadmin"){if(isAdmin())S.admin="";}
  else if(a==="addmember"){var nn2=val("nm");if(!nn2||S.members.some(function(m){return m.toLowerCase()===nn2.toLowerCase();}))return;S.members.push(nn2);}
  else if(a==="rmmember"){if(S.members.length<=2)return;if(confirmRm===id){S.members=S.members.filter(function(m){return m!==id;});if(S.admin===id)S.admin="";confirmRm="";}else{confirmRm=id;}}
  else if(a==="openprofile"){drawer.open=true;drawer.view="profile";}
  else if(a==="sendchat"){var tx=val("ct");if(!tx||S.members.indexOf(S.me)<0)return;S.chat=S.chat||[];S.chat.push({id:uid(),who:S.me,text:tx,at:Date.now()});chatFocus=true;}
  else if(a==="zoneoff"){zoneOff[id]=(zoneOff[id]||0)+parseInt(el.dataset.d,10);}
  else if(a==="zoneday"){var z2=(S.zones||[]).filter(function(x){return x.id===id;})[0];if(z2){var kk=el.dataset.k,ii=el.dataset.i;z2.days=z2.days||{};z2.days[kk]=z2.days[kk]||{};z2.days[kk][ii]=!z2.days[kk][ii];}}
  else if(a==="zonedone"){var zz=(S.zones||[]).filter(function(x){return x.id===id;})[0];if(zz){zz.done=zz.done||{};zz.done[el.dataset.k]=!zz.done[el.dataset.k];}}
  else if(a==="done"){var c=S.chores.filter(function(x){return x.id===id;})[0];if(c){c.last={who:S.members[c.idx%S.members.length],at:Date.now()};c.idx++;}}
  else if(a==="delchore"){S.chores=S.chores.filter(function(x){return x.id!==id;});}
  else if(a==="addchore"){var n=val("cn");if(!n)return;S.chores.push({id:uid(),name:n,idx:0,last:null});}
  else if(a==="addexp"){
    var amt=parseFloat(val("ea").replace(",","."));var ds=val("ed");
    if(!ds||!(amt>0)){alert("Scrivi cosa hai pagato e un importo maggiore di zero.");return;}
    S.expenses.push({id:uid(),desc:ds,amount:Math.round(amt*100)/100,payer:val("ep"),parts:S.members.slice(),at:Date.now()});
  }
  else if(a==="delexp"){S.expenses=S.expenses.filter(function(x){return x.id!==id;});}
  else if(a==="settle"){if(confirmSettle){S.expenses=[];S.payments=[];S.paid={};confirmSettle=false;}else{confirmSettle=true;keepConfirm=true;}}
  else if(a==="addnote"){var t=val("nt");if(!t)return;S.notes.push({id:uid(),text:t,who:val("nw"),at:Date.now()});}
  else if(a==="delnote"){S.notes=S.notes.filter(function(x){return x.id!==id;});}
  else if(a==="reset"){if(confirmReset){deleteHouse();confirmReset=false;}else{confirmReset=true;keepConfirm=true;}}
  if(!keepConfirm&&a!=="settle"&&a!=="reset"){confirmSettle=false;confirmReset=false;}if(a!=="rmmember")confirmRm="";
  save();render();if(chatFocus){chatFocus=false;var ci=document.getElementById("ct");if(ci)ci.focus();}
});
document.addEventListener("change",function(e){var t=e.target;if(!t.dataset||!t.dataset.plan||!isAdmin())return;var p=t.dataset.plan.split(":");S.plan=S.plan||{};S.plan[p[0]]=S.plan[p[0]]||{};if(t.value)S.plan[p[0]][p[1]]=t.value;else delete S.plan[p[0]][p[1]];save();render();});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="ct"){e.preventDefault();var sb=document.querySelector('[data-act="sendchat"]');if(sb)sb.click();return;}if(e.key==="Escape"&&drawer.open){drawer.open=false;render();}});
render();
</script>
